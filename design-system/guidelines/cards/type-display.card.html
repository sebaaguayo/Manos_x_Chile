<!-- @dsCard group="Type" viewport="700x230" name="Display & Headings" subtitle="Be Vietnam Pro — bold, uppercase, tracked" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink-900); }
  .wrap { padding: 26px 32px; display: flex; flex-direction: column; gap: 18px; }
  .line { display: flex; align-items: baseline; gap: 20px; border-bottom: 1.5px solid var(--line-soft); padding-bottom: 16px; }
  .spec { font-size: 0.6rem; color: var(--ink-400); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; width: 140px; flex-shrink: 0; }
</style></head>
<body>
<div class="wrap">
  <div class="line"><span class="spec">Display · 72 / 900</span><span style="font-size:3rem;font-weight:900;letter-spacing:0.06em;line-height:1;text-transform:uppercase">Ecomadera</span></div>
  <div class="line"><span class="spec">Section · 40 / 500</span><span style="font-size:2.1rem;font-weight:500;letter-spacing:0.16em;text-transform:uppercase">Productos</span></div>
  <div class="line" style="border:none"><span class="spec">Sub · 30 / 600 · green</span><span style="font-size:1.6rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--green-500)">Materias Primas</span></div>
</div>
</body></html>
