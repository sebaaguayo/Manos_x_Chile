<!-- @dsCard group="Colors" viewport="700x150" name="Ocean Blue" subtitle="Energetic secondary — CTAs & card rings" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); }
  .row { display: flex; padding: 22px; gap: 10px; align-items: flex-start; }
  .sw { flex: 1; display: flex; flex-direction: column; }
  .chip { height: 64px; border-radius: 14px; }
  .meta { padding: 8px 2px 0; }
  .name { font-size: 0.72rem; font-weight: 700; color: var(--ink-900); }
  .hex { font-size: 0.68rem; color: var(--ink-400); font-variant-numeric: tabular-nums; }
  .ring { flex: 1.4; height: 80px; border-radius: 18px; background: var(--paper); box-shadow: var(--ring-card-blue); display:flex; align-items:center; justify-content:center; font-size:0.66rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color: var(--blue-500); }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="meta"><div class="name">blue-700</div><div class="hex">#0A4F9E</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="meta"><div class="name">blue-500 ·accent</div><div class="hex">#0066CC</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="meta"><div class="name">blue-100</div><div class="hex">#DCEBFA</div></div></div>
  <div class="ring">Ring 3px</div>
</div>
</body></html>
