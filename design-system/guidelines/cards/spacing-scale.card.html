<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="Airy rhythm (4px base)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink-900); }
  .wrap { padding: 24px 32px; display: flex; flex-direction: column; gap: 10px; }
  .r { display: flex; align-items: center; gap: 16px; }
  .bar { height: 14px; background: var(--green-500); border-radius: 7px; }
  .lbl { font-size: 0.68rem; color: var(--ink-400); width: 140px; flex-shrink: 0; font-variant-numeric: tabular-nums; font-weight: 700; }
</style></head>
<body>
<div class="wrap">
  <div class="r"><span class="lbl">space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="lbl">space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="lbl">space-6 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="lbl">space-8 · 64px</span><div class="bar" style="width:64px"></div></div>
  <div class="r"><span class="lbl">space-9 · 96px ·section</span><div class="bar" style="width:96px"></div></div>
  <div class="r"><span class="lbl">space-11 · 160px ·hero</span><div class="bar" style="width:160px"></div></div>
</div>
</body></html>
