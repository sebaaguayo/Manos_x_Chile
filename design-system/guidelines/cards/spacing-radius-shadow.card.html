<!-- @dsCard group="Spacing" viewport="700x180" name="Beveled Radii" subtitle="Friendly rounded corners (8 → 28px)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink-900); }
  .wrap { padding: 26px 32px; display: flex; gap: 26px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 76px; height: 60px; background: var(--paper); box-shadow: var(--ring-card-blue); }
  .lbl { font-size: 0.62rem; color: var(--ink-400); text-align: center; font-weight: 700; }
</style></head>
<body>
<div class="wrap">
  <div class="item"><div class="box" style="border-radius:8px"></div><span class="lbl">xs · 8px<br>chips</span></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><span class="lbl">sm · 12px<br>tags</span></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><span class="lbl">md · 14px<br>buttons</span></div>
  <div class="item"><div class="box" style="border-radius:22px"></div><span class="lbl">lg · 22px<br>images</span></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><span class="lbl">xl · 24px<br>cards</span></div>
  <div class="item"><div class="box" style="border-radius:999px;width:60px"></div><span class="lbl">full<br>pills</span></div>
</div>
</body></html>
