<!-- @dsCard group="Colors" viewport="700x150" name="Brand Greens" subtitle="Vivid recycled-green scale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); }
  .row { display: flex; padding: 22px; gap: 10px; }
  .sw { flex: 1; display: flex; flex-direction: column; }
  .chip { height: 64px; border-radius: 14px; }
  .meta { padding: 8px 2px 0; }
  .name { font-size: 0.72rem; font-weight: 700; color: var(--ink-900); }
  .hex { font-size: 0.68rem; color: var(--ink-400); font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--green-900)"></div><div class="meta"><div class="name">green-900</div><div class="hex">#016C3F</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--green-700)"></div><div class="meta"><div class="name">green-700</div><div class="hex">#0BA152</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="meta"><div class="name">green-500 ·primary</div><div class="hex">#0FBF62</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--green-100)"></div><div class="meta"><div class="name">green-100</div><div class="hex">#DBF7E8</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--green-50);border:1px solid var(--line)"></div><div class="meta"><div class="name">green-50</div><div class="hex">#EFFBF4</div></div></div>
</div>
</body></html>
