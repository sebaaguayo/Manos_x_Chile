<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .hero { position: relative; height: 240px; overflow: hidden; border-radius: 24px; box-shadow: var(--ring-card-blue); }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .ov { position: absolute; inset: 0; background: var(--overlay-hero); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
  .tag { display:inline-block; font-size:0.6rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#fff; background:var(--green-500); padding:0.35rem 0.8rem; border-radius:999px; margin-bottom:14px; }
  .ov h1 { color: #fff; font-weight: 900; font-size: 1.9rem; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 14px; line-height: 1.05; }
  .btns { display: flex; gap: 12px; }
  .b { padding: 0.65rem 1.5rem; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; border-radius: 14px; }
  .b.primary { background: var(--blue-500); color: #fff; }
  .b.eco { background: var(--green-500); color: #fff; }
</style></head>
<body>
<div class="hero">
  <img src="../../assets/hero_banner.jpg" alt="" />
  <div class="ov">
    <span class="tag">Rescatado de playas · 100% reciclado</span>
    <h1>De la costa a tu proyecto</h1>
    <div class="btns"><span class="b eco">Ver Catálogo</span><span class="b primary">Cotizar</span></div>
  </div>
</div>
</body></html>
