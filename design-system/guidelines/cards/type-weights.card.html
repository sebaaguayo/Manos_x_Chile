<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink-900); }
  .row { display: flex; padding: 26px 32px; gap: 26px; }
  .w { display: flex; flex-direction: column; gap: 6px; }
  .glyph { font-size: 2.6rem; line-height: 1; letter-spacing: 0.02em; }
  .lbl { font-size: 0.6rem; color: var(--ink-400); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
</style></head>
<body>
<div class="row">
  <div class="w"><span class="glyph" style="font-weight:400">Aa</span><span class="lbl">400 Reg</span></div>
  <div class="w"><span class="glyph" style="font-weight:500">Aa</span><span class="lbl">500 Med</span></div>
  <div class="w"><span class="glyph" style="font-weight:600">Aa</span><span class="lbl">600 Semi</span></div>
  <div class="w"><span class="glyph" style="font-weight:700">Aa</span><span class="lbl">700 Bold ★</span></div>
  <div class="w"><span class="glyph" style="font-weight:900">Aa</span><span class="lbl">900 Black ★</span></div>
</div>
</body></html>
