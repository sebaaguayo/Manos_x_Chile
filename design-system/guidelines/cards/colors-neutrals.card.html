<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & Surfaces" subtitle="Warm ink, gray, off-white" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); }
  .row { display: flex; padding: 22px; gap: 10px; }
  .sw { flex: 1; display: flex; flex-direction: column; }
  .chip { height: 64px; border-radius: 14px; border: 1px solid var(--line-soft); }
  .meta { padding: 8px 2px 0; }
  .name { font-size: 0.72rem; font-weight: 700; color: var(--ink-900); }
  .hex { font-size: 0.68rem; color: var(--ink-400); font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><div class="name">ink-900</div><div class="hex">#272626</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><div class="name">ink-500</div><div class="hex">#797979</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--line)"></div><div class="meta"><div class="name">line</div><div class="hex">#D9D9D9</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#F6F7F8</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="meta"><div class="name">paper</div><div class="hex">#FFFEFE</div></div></div>
</div>
</body></html>
